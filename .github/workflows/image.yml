name: image

# Builds the production image off-box and pushes it to GHCR, so the 1GB droplet
# only ever pulls (it OOMs building Next.js itself).
on:
  push:
    branches: [master, main]
  workflow_dispatch:
  # Daily rebuild on the latest node:24-alpine base so security patches land
  # without a code change. The droplet's ~/infra/auto-update.sh pulls at 10:00 UTC.
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Stamp the image with the commit time, so a scheduled rebuild with no new
          # base image yields the same digest and the droplet doesn't restart NOSI.
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
