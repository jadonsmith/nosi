services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nosi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nosi}
      POSTGRES_DB: nosi
    volumes:
      - nosi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nosi -d nosi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://nosi:${POSTGRES_PASSWORD:-nosi}@db:5432/nosi
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      NOSI_STALE_MINUTES: ${NOSI_STALE_MINUTES:-2}
      NOSI_DOWN_MINUTES: ${NOSI_DOWN_MINUTES:-10}
      NOSI_GEOLOCATE: ${NOSI_GEOLOCATE:-true}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  nosi-db:
